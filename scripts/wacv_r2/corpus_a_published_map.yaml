# =============================================================================================
# A1 Corpus A — which published mapping rows each functional family corresponds to.
#
# The published tables map TRANSFORM CLASSES (random wrappers). This file records, per family,
# the rows whose named classes wrap that family's functional core. It is the join that lets the
# claim-vs-execution matrix be built over exactly the pairs the tables actually name, and it is
# the honest statement of A1/01 §3's caveat: the tables supply the CANDIDATE PAIRS, the
# functional-level equivalence hypothesis is ours.
#
# AUTHORED FROM DOCUMENTATION ONLY, BEFORE EXECUTION. `left_name` values are copied verbatim from
# the frozen published_rows.json; a typo therefore fails loudly at join time rather than silently
# dropping a row.
#
# `left_impl` / `right_impl` name the functional cores that stand in for the two classes. A row is
# only joinable when both sides have a functional core in this corpus; rows whose counterpart is a
# dash carry no second function and are excluded from the matrix by construction (A1/01 §6).
# =============================================================================================

version: 1
authored: 2026-08-19

rows:
