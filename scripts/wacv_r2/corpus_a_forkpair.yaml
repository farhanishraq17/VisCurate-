# =============================================================================================
# A1 Corpus A -- FORK PAIR: pilgram 2.0.0 vs pilgram2 2.0.10
#
# WHY THIS PAIR. Every other family in Corpus A compares INDEPENDENT reimplementations across
# libraries that were never meant to agree. This pair is different in kind: pilgram2 is a FORK of
# pilgram. Same filter names, forked source, years of independent divergence, and -- the point --
# **nobody curates across them**. A user who pip-installs both has 25 pairs of
# identically-named filters in one environment with no mechanism that would ever notice.
# That is the paper's thesis occurring in the wild rather than injected by a corruption harness.
#
# ALIGNMENT IS BIJECTIVE BY VACUITY, NOT BY JUDGEMENT. These are fixed Instagram-style presets:
# every filter takes exactly one argument (the image) and exposes NO parameters. `canonical_params`
# is therefore empty for every family, the parameter grid is a single point, and `alignment: full`
# is a statement about an empty parameter space rather than a mapping anyone had to choose.
#
# ★ HONEST DISCLOSURE ABOUT AUTHORING ORDER. The other alignment files in this corpus were written
# from documentation BEFORE any execution, because a parameter mapping chosen after seeing outputs
# is contaminated. Here the fork's shared-name list was enumerated programmatically and the filters
# were executed once on a random probe before this file was generated. That is disclosed rather
# than hidden -- and it cannot contaminate anything, because there is no parameter to tune and no
# alignment choice to make. The equivalence hypothesis (same name across the fork => candidate
# pair) comes from the fork relationship itself, not from any observed output.
#
# Generated by scripts/wacv_r2/gen_fork_pair_alignment.py. Hashed into the run manifest.
# pilgram  2.0.0  : 25 filters
# pilgram2 2.0.10 : 39 filters (14 added in the fork, 0 removed)
# shared (scored) : 25
# added-only (NOT scored -- no counterpart exists): amaro, ashby, charmes, crema, dogpatch, ginza, hefe, helena, juno, ludwig, poprocket, sierra, skyline, sutro
# =============================================================================================

version: 1
authored: 2026-08-22

families:

  - family: pilgram_aden
    canonical_params: {}
    implementations:
      - id: pilgram.aden
        adapter: pil_rgb
        call: "pilgram.aden(img)"
        alignment: full
        notes: "Fork parent, pilgram 2.0.0. No parameters."
      - id: pilgram2.aden
        adapter: pil_rgb
        call: "pilgram2.aden(img)"
        alignment: full
        notes: "Fork child, pilgram2 2.0.10. No parameters."

