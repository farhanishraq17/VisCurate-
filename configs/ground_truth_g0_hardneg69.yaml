  - [rotate_180_v1, rotate_270_v1]
  - [rotate_45_v1, rotate_90_v1]
  - [flip_horizontal_v1, flip_vertical_v1]
  - [flip_horizontal_v1, transpose_v1]
  - [flip_vertical_v1, transpose_v1]
  - [transpose_v1, rotate_90_v1]
  - [shear_horizontal_v1, shear_vertical_v1]
  - [crop_center_percentage_v1, random_crop_v1]
