  - [zoom_in_center_v1, crop_center_percentage_v1]
  - [translate_v1, scale_xy_v1]
  - [tile_2x2_v1, overlay_grid_v1]
  - [grayscale_bt601_v1, desaturate_partial_v1]
  - [brightness_add_v1, brightness_multiply_v1]
  - [brightness_multiply_v1, contrast_scale_v1]
  - [gamma_correct_v1, levels_adjust_v1]
  - [contrast_scale_v1, linear_contrast_stretch_v1]
